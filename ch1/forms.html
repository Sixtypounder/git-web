<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>My First Form</h2>
    <form>

        <div>
            <input type="radio" name="gender" value="male" id="fldMale"checked> <label for="fldMale">Άνδρας</label>
            <br>
            <input type="radio" name="gender" value="female" id="fldFemale"> <label for="fldFemale"> Γυναίκα </label>
        </div>

        <div>
            <input type="checkbox" name="vehicle1" value="bike" id="fldBike" checked>
            <label for="fldBike">Ποδήλατο</label><br>
            <input type="checkbox" name="vehicle2" value="motorcycle" id="fldMotorcycle">
            <label for="fldMotorcycle">Μοτοσυκλέτα</label> <br>
            <input type="checkbox" name="vehicle3" value="car" id="fldCar">
            <label for="fldCar">Αυτοκίνητο</label>
        </div>

        <div>
            <label for="fldNationality">Υπηκοότητα</label>
            <select name="nationality" id="fldNationality">
                <option value="" disabled selected>Επιλέξτε Υπηκοότητα</option>
                <option value="greek">Ελλάδα</option>
                <option value="english">Αγγλία</option>
                <option value="spain">Ισπανία</option>
            </select>
        </div>
          

        <fieldset> 
         <legend>Προσωπικά στοιχεία</legend>
        <div>
            <div>
            <label for="fldFirsname">Όνομα</label>
            <input type="text" name="firstname" id="fldFirsname" placeholder="Συμπληρώστε όνομα" minlength="5" maxlength="15" required>
            </div>
        </div>

        <div> 
         
            
             <div>
                <label for="fldLastname">Επώνυμο</label>
                <input type="text" name="lastname" id="fldLastname" placeholder="Συμπληρώστε επώνυμο" minlength="5" maxlength="15" required>
                </div>
            </div>

            <div>
                <label for="fldWorkExperience">Χρόνια προυπηρεσίας</label>
                <input type="number" name="work-experience" id="fldWorkExperience" min="3" max="20">
            </div>
            
            <div>
            <div>
                <label for="fldEmail">Email</label>
                <input type="email" name="email" id="fldEmail">
            </div>
        </div>
           </fieldset>

        <div>
            <label for="fldmessage">Γράψτε το μήνυμα σας</label>
            <textarea name="message" id="fldmessage" rows="10" cols="30"></textarea>
        </div>

        <div>
            <input type="submit" value="Υποβολή">
            <input type="reset" value="Καθάρισμα">
        </div>

         
    </form>
</body>
</html>
