<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αίτηση συμμετοχής</title>
</head>
<body>

    <fieldset>
        <div>
        <legend>Αίτηση συμμετοχής</legend>
        <h1>Προσωπικά Στοιχεία</h1>
        <label for="fldFirstname">Όνομα</label>
        <input type="text" name="fldFirstname" id="fldFirstname" placeholder="Συμπληρώστε όνομα" required>

        <label for="fldLastname">Επώνυμο</label>
        <input type="text" name="fldLastname" id="fldLastname" placeholder="Συμπληρώστε Επώνυμο" required>

        <label for="fldFathersname">Πατρόνυμο</label>
        <input type="text" name="fldFathersname" id="fldFathersname" placeholder="Συμπληρώστε Πατρώνυμο" required>


        </div>
        


        <h2>Στοιχεία Κατοικίας</h2>

        <div>
        <label for="fldAdress">Διεύθυνση Κατοικίας</label>
        <input type="text" name="fldAdress" id="fldAdress" placeholder="Συμπληρώστε Διεύθυνση" required>

        <label for="fldnumber">Αριθμός</label>
        <input type="text" name="fldnumber" id="fldnumber" placeholder="Συμπληρώστε Αριθμό" required>

        <label for="fldpC">Τ.Κ.</label>
        <input type="text" name="fldpC" id="fldpC" placeholder="Συμπληρώστε Τ.Κ." required>
        </div>

        <h3>Στοιχεία Επικοινωνίας</h3>

        <div>
        <label for="fldPhone">Τηλέφωνο</label>
        <input type="text" name="fldPhone" id="fldPhone" placeholder="Συμπληρώστε Τηλέφωνο" required>

        <label for="fldNumber1">Αριθμός</label>
        <input type="text" name="fldNumber1" id="fldNumber1" placeholder="Συμπληρώστε Αριθμό" required>

        </div>



    </fieldset>
    
</body>
</html>
